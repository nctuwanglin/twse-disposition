name: 公告來源時效探測（手動診斷）

# 目的：釐清證交所處置公告幾點才真的取得到。
#
# 結論（2026-11-14，分析 10/15–11/13 共 86 次探測，見 docs/probe-window-analysis.md）：
#   openapi 對公告日 D 的公告要到 D+1 早上 06–11 點才出現；RWD 在 D 當天約 18:15
#   前就有。主更新已改用 RWD（openapi 為備援），排程時段不需調整。
#
# 蒐證任務已完成，排程停用；保留手動觸發，日後懷疑公告時效有變時可再跑。
# 每次執行把兩個來源的內容印進 run log，並上傳 JSON artifact（保留 30 天），
# 含實際執行時刻、公告識別與內容雜湊。純診斷：不修改 repository。

on:
  workflow_dispatch:

# 探測獨立排隊，不與主更新共用 concurrency group。
concurrency:
  group: probe-announcement-sources
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Probe announcement sources
        run: python scripts/probe_announcement_sources.py --output .run/probe.json
      - name: Upload diagnostic probe result
        uses: actions/upload-artifact@v6
        with:
          name: announcement-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: .run/probe.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
