name: 盤後自動更新處置股儀表板

on:
  schedule:
    # GitHub scheduled workflows 為 best-effort，整點（尤其 :00）壅塞時實測延遲 5-6.5 小時，
    # 故 (1) 錯峰選非整點分鐘 (2) 提早排程 (3) 排兩班互為備援（腳本冪等，重跑無害）。
    # 台股收盤 13:30，處置公告約 17:00 發布。
    - cron: "37 9 * * 1-5"   # 台灣 17:37 主跑
    - cron: "17 12 * * 1-5"  # 台灣 20:17 補跑（主跑延遲或失敗時的備援）

  # 允許手動觸發（測試用）
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "確認過處置檔數驟降屬實時打勾，放行驟降守則（僅此一項防線）"
        type: boolean
        default: false

# 兩班排程實測都會延遲數小時，加上手動觸發，有機會重疊執行；同時跑會互相
# 覆寫產物並在 push 時打架。排隊而非取消：後到的那班仍然要跑完（它可能才是
# 抓得到晚間公告的那一班）。
concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Capture checkout base SHA
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Optional diagnostic: default stdout only; never stage probe output.
      - name: Probe announcement sources (diagnostic stdout only)
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/probe_announcement_sources.py

      - name: Run parser tests
        run: python -m unittest discover -s tests -q

      - name: Run health tests
        run: node tests/test_health.cjs

      - name: Run update script
        env:
          ALLOW_DROP: ${{ inputs.allow_drop }}
        run: |
          if [ "$ALLOW_DROP" = "true" ]; then
            python scripts/run_update.py --allow-drop
          else
            python scripts/run_update.py
          fi

      - name: Validate generated bundle before staging
        run: PYTHONPATH=scripts python -c 'import artifact_bundle; artifact_bundle.validate(".")'

      - name: Commit market artifacts and status separately
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ=Asia/Taipei date "+%Y/%m/%d %H:%M")
          git add index.html dispo.json build-manifest.json assets/health.js \
                  data/history data/last_counts.json data/perf_stats.json data/stock_info.json
          if ! git diff --cached --quiet; then
            git commit -m "auto: 更新處置股儀表板產物 ${DATE}"
          fi
          git add update-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新執行狀態 heartbeat ${DATE}（非市場資料更新）"
          fi

      - name: Push without rebasing or forcing
        env:
          EXPECTED_BASE: ${{ steps.base.outputs.sha }}
        run: python scripts/push_update.py --expected-base "$EXPECTED_BASE"

      # Explicit build request: GITHUB_TOKEN pushes may not trigger Pages.
      # Request failure is diagnostic; public-byte verification remains mandatory.
      - name: Request Pages build
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/${REPOSITORY}/pages/builds"

      - name: Verify live deployment
        run: python scripts/verify_deployment.py --url https://nctuwanglin.github.io/twse-disposition/

      - name: Upload update status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: update-status.json
          if-no-files-found: warn
